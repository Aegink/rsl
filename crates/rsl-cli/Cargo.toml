[package]
name = "rsl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RSL command line tool: lint/compile/run/test/record/convert/import/build/pack/explain/fuzz"

[[bin]]
name = "rsl"
path = "src/main.rs"

[dependencies]
ureq = { workspace = true }
notify = "7"
rsl-core = { path = "../rsl-core" }
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
