[workspace]
resolver = "2"
members = [
    "crates/rsl-core",
    "crates/rsl-cli",
    "crates/rsl-ffi",
    "crates/rsl-wasm",
    "crates/rsl-lsp",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["rsl-spec"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
encoding_rs = "0.8"
bincode = "1.3"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
des = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
inout = "0.1"
scraper = "0.29"
ego-tree = "0.11"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
boa_engine = "0.20"
boa_gc = "0.20"
wasm-bindgen = "0.2"
serde_yaml = "0.9"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
